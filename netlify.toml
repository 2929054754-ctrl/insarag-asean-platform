# Root config: app code lives under ./app
[build]
  base = "app"
  publish = "out"
  functions = "netlify/functions"
  command = "npm install --no-audit --no-fund && bash build_static.sh"

# Ship the offline-exported data artifacts inside the JS function
[functions]
  included_files = ["function_data/**"]

# Unmatched paths (not shadowed by a static file) go to the function
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app"
  status = 200
